name: Publish Docker Image (GHCR)

concurrency:
  group: publish-docker-image-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "server/**"
      - "relay/**"
      - "Dockerfile"
      - ".github/workflows/**"

  workflow_dispatch:
    inputs:
      version:
        description: Docker image verzió tag (pl. 1.2.3)
        type: string
        required: true
      latest:
        description: Állítsa be a 'latest' taget is?
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  server:
    name: Server
    uses: ./.github/workflows/reusable-server-test-build.yaml
    with:
      working-directory: ./server
    secrets: inherit

  client:
    name: Client
    uses: ./.github/workflows/reusable-client-test-build.yaml
    with:
      working-directory: ./client
    secrets: inherit

  build-and-push:
    name: Build Docker image and Publish
    needs:
      - server
      - client

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Git Checkout
        uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
        name: Docker QEMU

      - uses: docker/setup-buildx-action@v4
        name: Docker Buildx

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev,enable=${{ github.event_name != 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && (inputs.latest == true || inputs.latest == 'true') }}

      - name: Validate manual version tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker image tag"
            exit 1
          fi

      - name: Compute version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$RELEASE_VERSION" ]; then
            echo "value=v${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Publish
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
